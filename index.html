<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MillyGram</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#050510;--bg2:#0c0c24;--card:#111135;--border:#1e1e55;
  --violet:#7c3aed;--violet2:#a78bfa;--violet3:#c4b5fd;
  --text:#e8e8ff;--dim:#5a5a8a;--green:#22c55e;--red:#ef4444;
  --glow:rgba(124,58,237,0.35);
}
html,body{height:100%;font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);overflow:hidden}

/* ===== SPLASH ===== */
#splash{position:fixed;inset:0;z-index:999;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .8s,visibility .8s}
#splash.hide{opacity:0;visibility:hidden;pointer-events:none}
.s-ring{position:relative;width:140px;height:140px}
.s-ring svg{width:100%;height:100%}
.s-ring .ring1{position:absolute;inset:0;animation:spin 3s linear infinite}
.s-ring .ring2{position:absolute;inset:12px;animation:spin 2s linear infinite reverse}
.s-ring .ring3{position:absolute;inset:24px;animation:spin 4s linear infinite}
.s-letter{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:42px;font-weight:900;background:linear-gradient(135deg,var(--violet2),#fff);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
@keyframes spin{to{transform:rotate(360deg)}}
.s-title{margin-top:28px;font-size:36px;font-weight:900;letter-spacing:6px;background:linear-gradient(135deg,var(--violet2),var(--violet3),#fff);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.s-sub{margin-top:8px;color:var(--dim);font-size:11px;letter-spacing:8px;text-transform:uppercase}
.s-dots{margin-top:40px;display:flex;gap:8px}
.s-dots i{width:8px;height:8px;border-radius:50%;background:var(--violet2);animation:dot 1.4s ease-in-out infinite}
.s-dots i:nth-child(2){animation-delay:.16s}
.s-dots i:nth-child(3){animation-delay:.32s}
@keyframes dot{0%,80%,100%{transform:scale(.35);opacity:.25}40%{transform:scale(1);opacity:1}}

/* ===== AUTH ===== */
#auth{display:none;flex-direction:column;align-items:center;justify-content:center;height:100vh;height:100dvh;padding:24px 20px;animation:up .6s ease}
.auth-logo{width:88px;height:88px}
.auth-logo svg{width:100%;height:100%}
.auth-name{margin-top:14px;font-size:32px;font-weight:900;letter-spacing:3px;background:linear-gradient(135deg,var(--violet2),#fff);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.auth-moto{margin-top:4px;font-size:11px;color:var(--dim);letter-spacing:5px;text-transform:uppercase}
.auth-box{width:100%;max-width:380px;margin-top:36px}
.auth-tabs{display:flex;border:1px solid var(--border);border-radius:14px;overflow:hidden;background:var(--bg2)}
.auth-tabs button{flex:1;padding:13px;border:none;background:transparent;color:var(--dim);font:600 14px/1 'Inter',sans-serif;cursor:pointer;transition:.3s}
.auth-tabs button.on{background:var(--violet);color:#fff}
.auth-forms{margin-top:20px;display:flex;flex-direction:column;gap:14px}
.afield{position:relative}
.afield input{width:100%;padding:15px 18px;background:var(--bg2);border:1px solid var(--border);border-radius:12px;color:var(--text);font:400 15px/1 'Inter',sans-serif;outline:0;transition:.3s}
.afield input:focus{border-color:var(--violet2);box-shadow:0 0 0 3px var(--glow)}
.afield input::placeholder{color:var(--dim)}
.abtn{width:100%;padding:15px;border:0;border-radius:14px;background:linear-gradient(135deg,var(--violet),#9333ea);color:#fff;font:700 16px/1 'Inter',sans-serif;cursor:pointer;margin-top:6px;transition:.2s}
.abtn:hover{box-shadow:0 6px 30px var(--glow);transform:translateY(-1px)}
.abtn:active{transform:scale(.97)}
.aerr{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.25);color:#fca5a5;padding:11px 16px;border-radius:12px;font-size:13px;text-align:center;display:none}
.ahint{color:var(--dim);font-size:11px;text-align:center;margin-top:10px;line-height:1.6}
.auth-footer{position:absolute;bottom:20px;left:0;right:0;text-align:center;color:var(--dim);font-size:11px;line-height:2}
.auth-footer b{color:var(--violet2);font-weight:600}
.auth-footer a{color:var(--violet2);text-decoration:none;cursor:pointer}
.auth-footer a:hover{text-decoration:underline}

/* ===== CHAT ===== */
#chat{display:none;flex-direction:column;height:100vh;height:100dvh}
.ch-head{display:flex;align-items:center;padding:14px 16px;gap:12px;background:var(--bg2);border-bottom:1px solid var(--border);flex-shrink:0}
.ch-logo{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--violet),#9333ea);display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:900;color:#fff;flex-shrink:0}
.ch-info{flex:1}
.ch-title{font-size:16px;font-weight:700}
.ch-status{font-size:11px;color:var(--dim)}
.ch-my{font-size:12px;color:var(--violet2);background:rgba(124,58,237,.12);padding:5px 12px;border-radius:8px;flex-shrink:0}
.ch-body{flex:1;display:flex;overflow:hidden}
.ch-msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.c-msg{padding:12px 16px;border-radius:14px;max-width:82%;animation:up .25s ease}
.c-msg.other{background:var(--card);border:1px solid var(--border);align-self:flex-start}
.c-msg.mine{background:linear-gradient(135deg,var(--violet),#6d28d9);align-self:flex-end;border:none}
.c-who{font-size:11px;font-weight:600;color:var(--violet2);margin-bottom:3px}
.c-msg.mine .c-who{color:rgba(255,255,255,.65)}
.c-txt{font-size:14px;line-height:1.55;word-break:break-word}
.c-time{font-size:10px;color:var(--dim);margin-top:5px;text-align:right}
.c-msg.mine .c-time{color:rgba(255,255,255,.4)}
.c-empty{text-align:center;color:var(--dim);margin:auto;padding:40px;font-size:13px;line-height:1.7}
.ch-people{width:150px;flex-shrink:0;border-left:1px solid var(--border);padding:14px;overflow-y:auto;background:var(--bg2)}
.ch-people h4{font-size:10px;color:var(--dim);letter-spacing:3px;text-transform:uppercase;margin-bottom:12px}
.cp{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:13px}
.cp-dot{width:8px;height:8px;border-radius:50%;background:var(--dim);flex-shrink:0}
.cp-dot.on{background:var(--green);box-shadow:0 0 8px rgba(34,197,94,.5)}
.ch-bar{padding:12px 16px;display:flex;gap:10px;background:var(--bg2);border-top:1px solid var(--border);flex-shrink:0}
.ch-bar input{flex:1;padding:13px 18px;background:var(--bg);border:1px solid var(--border);border-radius:12px;color:var(--text);font:400 14px/1 'Inter',sans-serif;outline:0}
.ch-bar input:focus{border-color:var(--violet2)}
.ch-bar button{padding:13px 22px;border:0;border-radius:12px;background:linear-gradient(135deg,var(--violet),#9333ea);color:#fff;font:700 14px/1 'Inter',sans-serif;cursor:pointer}
.ch-bar button:active{transform:scale(.95)}

@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}

/* mobile */
@media(max-width:580px){
  .ch-people{display:none;position:fixed;right:0;top:0;bottom:0;width:180px;z-index:50;background:var(--bg2);border-left:1px solid var(--border);padding:16px}
  .ch-people.show{display:block}
}
</style>
</head>
<body>

<!-- ===== SPLASH ===== -->
<div id="splash">
  <div class="s-ring">
    <svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="none" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="8 6" opacity=".4"/></svg>
    <svg viewBox="0 0 100 100" class="ring1"><circle cx="50" cy="50" r="46" fill="none" stroke="url(#rg)" stroke-width="2.5" stroke-dasharray="40 240" stroke-linecap="round"/><defs><linearGradient id="rg"><stop offset="0%" stop-color="#a78bfa"/><stop offset="100%" stop-color="#7c3aed"/></linearGradient></defs></svg>
    <svg viewBox="0 0 100 100" class="ring2"><circle cx="50" cy="50" r="34" fill="none" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="20 60" stroke-linecap="round" opacity=".5"/></svg>
    <svg viewBox="0 0 100 100" class="ring3"><circle cx="50" cy="50" r="22" fill="none" stroke="#c4b5fd" stroke-width="1" stroke-dasharray="10 40" stroke-linecap="round" opacity=".3"/></svg>
    <div class="s-letter">M</div>
  </div>
  <div class="s-title">MILLYGRAM</div>
  <div class="s-sub">загрузка</div>
  <div class="s-dots"><i></i><i></i><i></i></div>
</div>

<!-- ===== AUTH ===== -->
<div id="auth">
  <div class="auth-logo"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="none" stroke="#7c3aed" stroke-width="2" opacity=".35"/><text x="50" y="58" text-anchor="middle" font-size="30" font-weight="900" fill="#a78bfa" font-family="Inter,sans-serif">M</text></svg></div>
  <div class="auth-name">MillyGram</div>
  <div class="auth-moto">таинственный мир общения</div>
  <div class="auth-box">
    <div class="auth-tabs">
      <button class="on" onclick="tab('login')">Вход</button>
      <button onclick="tab('reg')">Регистрация</button>
    </div>
    <div class="aerr" id="aerr"></div>
    <div class="auth-forms" id="f-login">
      <div class="afield"><input id="li" placeholder="Логин" autocomplete="username"></div>
      <div class="afield"><input id="lp" type="password" placeholder="Пароль" autocomplete="current-password"></div>
      <button class="abtn" onclick="doLogin()">Войти</button>
    </div>
    <div class="auth-forms" id="f-reg" style="display:none">
      <div class="afield"><input id="ri" placeholder="Логин (3-20 символов)" autocomplete="username"></div>
      <div class="afield"><input id="rn" placeholder="Никнейм (как тебя звать)"></div>
      <div class="afield"><input id="rp" type="password" placeholder="Пароль (6+ символов)" autocomplete="new-password"></div>
      <button class="abtn" onclick="doReg()">Создать аккаунт</button>
      <div class="ahint">Регистрация открыта. Создатель сайта — единственный модератор.</div>
    </div>
  </div>
  <div class="auth-footer">
    <div><b>14.07.2026</b> — наш сайт вышел</div>
    <div>дождитесь финала</div>
    <div style="margin-top:10px"><a onclick="tab('login')">общаться по чату →</a></div>
  </div>
</div>

<!-- ===== CHAT ===== -->
<div id="chat">
  <div class="ch-head">
    <div class="ch-logo">M</div>
    <div class="ch-info">
      <div class="ch-title">MillyGram</div>
      <div class="ch-status" id="ch-status">загрузка…</div>
    </div>
    <div class="ch-my" id="ch-my">—</div>
  </div>
  <div class="ch-body">
    <div class="ch-msgs" id="ch-msgs">
      <div class="c-empty">Тайные разговоры начинаются здесь…<br>Напиши первое сообщение ✨</div>
    </div>
    <div class="ch-people" id="ch-people">
      <h4>Участники</h4>
      <div id="plist"></div>
    </div>
  </div>
  <form class="ch-bar" onsubmit="return sendMsg(event)">
    <input id="cinp" placeholder="Написать сообщение…" maxlength="2000" autocomplete="off">
    <button type="submit">→</button>
  </form>
</div>

<script>
var DB_KEY='mgdb_v1', me=null;

function db(){try{return JSON.parse(localStorage.getItem(DB_KEY))||{users:[],messages:[],seq:1}}catch(e){return{users:[],messages:[],seq:1}}}
function save(d){localStorage.setItem(DB_KEY,JSON.stringify(d))}
function uid(){var c='abcdef0123456789',s='';for(var i=0;i<16;i++)s+=c[Math.random()*16|0];return s}

function tab(t){
  document.querySelectorAll('.auth-tabs button').forEach(function(b,i){b.className=(i===(t==='login'?0:1))?'on':''});
  document.getElementById('f-login').style.display=t==='login'?'flex':'none';
  document.getElementById('f-reg').style.display=t==='reg'?'flex':'none';
  hideErr();
}
function showErr(m){var e=document.getElementById('aerr');e.textContent=m;e.style.display='block'}
function hideErr(){document.getElementById('aerr').style.display='none'}
function show(id){['splash','auth','chat'].forEach(function(s){document.getElementById(s).style.display='none'});document.getElementById(id).style.display=id==='chat'?'flex':'flex'}

function doLogin(){
  hideErr();
  var li=document.getElementById('li').value.trim(),lp=document.getElementById('lp').value;
  if(!li||!lp)return showErr('Заполни все поля');
  var d=db(),u=d.users.find(function(x){return x.login.toLowerCase()===li.toLowerCase()});
  if(!u||u.pass!==lp)return showErr('Неверный логин или пароль');
  me={login:u.login,nick:u.nick};
  enterChat();
}

function doReg(){
  hideErr();
  var li=document.getElementById('ri').value.trim(),rn=document.getElementById('rn').value.trim(),rp=document.getElementById('rp').value;
  if(!li||!rp)return showErr('Заполни логин и пароль');
  if(li.length<3||li.length>20)return showErr('Логин: 3-20 символов');
  if(rp.length<6)return showErr('Пароль минимум 6 символов');
  var d=db();
  if(d.users.some(function(x){return x.login.toLowerCase()===li.toLowerCase()}))return showErr('Логин уже занят');
  d.users.push({login:li,nick:rn||li,pass:rp,created:Date.now()});
  save(d);
  me={login:li,nick:rn||li};
  enterChat();
}

function enterChat(){
  document.getElementById('ch-my').textContent=me.nick;
  show('chat');
  loadChat();
  loadPeople();
}

function loadChat(){
  var d=db(),box=document.getElementById('ch-msgs');
  if(!d.messages.length)return;
  box.innerHTML='';
  d.messages.forEach(function(m){
    var el=document.createElement('div');
    var mine=m.who===me.login;
    el.className='c-msg '+(mine?'mine':'other');
    var t=new Date(m.ts);
    el.innerHTML='<div class="c-who">'+esc(m.nick)+'</div><div class="c-txt">'+esc(m.text)+'</div><div class="c-time">'+('0'+t.getHours()).slice(-2)+':'+('0'+t.getMinutes()).slice(-2)+'</div>';
    box.appendChild(el);
  });
  box.scrollTop=box.scrollHeight;
}

function loadPeople(){
  var d=db(),pl=document.getElementById('plist');
  pl.innerHTML='';
  d.users.forEach(function(u){
    var el=document.createElement('div');
    el.className='cp';
    el.innerHTML='<div class="cp-dot on"></div><span>'+esc(u.nick)+'</span>';
    pl.appendChild(el);
  });
  document.getElementById('ch-status').textContent=d.users.length+' участников';
}

function sendMsg(e){
  e.preventDefault();
  var inp=document.getElementById('cinp'),txt=inp.value.trim();
  if(!txt)return false;
  inp.value='';
  var d=db();
  d.messages.push({id:d.seq++,who:me.login,nick:me.nick,text:txt,ts:Date.now()});
  if(d.messages.length>300)d.messages=d.messages.slice(-300);
  save(d);
  loadChat();
  return false;
}

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

function boot(){
  var d=db();
  var tok=null;try{tok=localStorage.getItem('mg_tok')}catch(e){}
  if(tok){
    var u=d.users.find(function(x){return x.login===tok});
    if(u){me={login:u.login,nick:u.nick};show('chat');loadChat();loadPeople();return}
  }
  setTimeout(function(){document.getElementById('splash').classList.add('hide');show('auth')},2200);
}

function enterChat(){document.getElementById('ch-my').textContent=me.nick;try{localStorage.setItem('mg_tok',me.login)}catch(e){}show('chat');loadChat();loadPeople()}

boot();
</script>
</body>
</html>
